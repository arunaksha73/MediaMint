# nixpacks.toml — inside backend/ directory
# Railway/Nixpacks uses this to install Python alongside Node.js
# so that "python3 -m yt_dlp" is available at runtime.

[phases.setup]
# nodejs_20 = Node.js 20 LTS
# python311 = Python 3.11 (pip is bundled with it in nixpkgs)
nixPkgs = ["nodejs_20", "python311"]

[phases.install]
cmds = [
    "npm install",
    "python3.11 -m pip install --user yt-dlp"
]

[start]
cmd = "node server.js"
