# nixpacks.toml — placed inside backend/ directory
# Railway will use this when "Root Directory" is set to "backend" in the dashboard.
#
# Tells Nixpacks to install Python (for yt-dlp) alongside Node.js.

[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
    "npm install",
    "pip install yt-dlp"
]

[start]
cmd = "node server.js"
